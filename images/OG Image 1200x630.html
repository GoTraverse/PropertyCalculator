<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>EquitySight — OG Image 1200×630</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=DM+Sans:ital,wght@0,400;1,300;1,400&display=swap" rel="stylesheet"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1200px; height:630px; overflow:hidden; background:#1A1A1A; }
</style>
</head>
<body>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">

const B = {
  charcoal:  '#1A1A1A',
  charcoal2: '#222222',
  gold:      '#F2C94C',
  goldLight: '#F7DC82',
  goldDark:  '#D4A017',
  white:     '#FFFFFF',
};

function RoofMark({ size=48, roofColor=B.white, barColors, chimney=false,
                    chimneyWidthScale=1, chimneyHeightScale=1 }) {
  const s=size, cx=s*0.5;
  const peakY=s*0.15, eaveY=s*0.46, eaveL=s*0.10, eaveR=s*0.90, bend=s*0.07, baseY=s*0.93, cr=s*0.06;
  const A=[eaveL,eaveY], BL=[cx-bend,peakY+s*0.035], BR=[cx+bend,peakY+s*0.035], C=[eaveR,eaveY];
  const uv=(ax,ay,bx,by)=>{const l=Math.sqrt((bx-ax)**2+(by-ay)**2);return[(bx-ax)/l,(by-ay)/l];};
  const uInA=uv(C[0],C[1],A[0],A[1]), uOutA=uv(A[0],A[1],BL[0],BL[1]);
  const A_in=[A[0]-cr*uInA[0],A[1]-cr*uInA[1]], A_out=[A[0]+cr*uOutA[0],A[1]+cr*uOutA[1]];
  const uInC=uv(BR[0],BR[1],C[0],C[1]), uOutC=uv(C[0],C[1],A[0],A[1]);
  const C_in=[C[0]-cr*uInC[0],C[1]-cr*uInC[1]], C_out=[C[0]+cr*uOutC[0],C[1]+cr*uOutC[1]];
  const barCount=chimney?3:4, barW=s*0.105, gap=s*0.072;
  const bx=(s-(barCount*barW+(barCount-1)*gap))/2-(chimney?s*0.03:0);
  const maxH=baseY-eaveY, barHs=chimney?[0.40,0.64,0.94]:[0.34,0.54,0.72,0.92];
  const bc=barColors||(chimney?['rgba(255,255,255,0.28)','rgba(255,255,255,0.52)',B.gold]:['rgba(255,255,255,0.28)','rgba(255,255,255,0.48)','rgba(255,255,255,0.68)',B.gold]);
  let roofPath;
  if (chimney) {
    const chW=s*0.11*chimneyWidthScale, chCx=s*0.67, chRx=s*0.11*chimneyWidthScale*0.18;
    const chLeft=chCx-chW/2, chRight=chCx+chW/2;
    const slopeY=x=>BR[1]+((x-BR[0])/(C[0]-BR[0]))*(C[1]-BR[1]);
    const chTopY=slopeY(chCx)-s*0.21*chimneyHeightScale;
    const chRY=slopeY(chRight), chLY=slopeY(chLeft);
    roofPath=[
      `M ${A_in[0]} ${A_in[1]}`,
      `Q ${A[0]} ${A[1]} ${A_out[0]} ${A_out[1]}`,
      `L ${BL[0]} ${BL[1]}`,
      `Q ${cx} ${peakY-s*0.005} ${BR[0]} ${BR[1]}`,
      `L ${chRight} ${chRY}`,
      `L ${chRight} ${chTopY+chRx}`,
      `Q ${chRight} ${chTopY} ${chRight-chRx} ${chTopY}`,
      `L ${chLeft+chRx} ${chTopY}`,
      `Q ${chLeft} ${chTopY} ${chLeft} ${chTopY+chRx}`,
      `L ${chLeft} ${chLY}`,
      `L ${C_in[0]} ${C_in[1]}`,
      `Q ${C[0]} ${C[1]} ${C_out[0]} ${C_out[1]}`,
      'Z',
    ].join(' ');
  } else {
    roofPath=[
      `M ${A_in[0]} ${A_in[1]}`,
      `Q ${A[0]} ${A[1]} ${A_out[0]} ${A_out[1]}`,
      `L ${BL[0]} ${BL[1]}`,
      `Q ${cx} ${peakY-s*0.005} ${BR[0]} ${BR[1]}`,
      `L ${C_in[0]} ${C_in[1]}`,
      `Q ${C[0]} ${C[1]} ${C_out[0]} ${C_out[1]}`,
      'Z',
    ].join(' ');
  }
  return (
    <svg width={s} height={s} viewBox={`0 0 ${s} ${s}`} fill="none" style={{flexShrink:0}}>
      {barHs.map((h,i)=><rect key={i} x={bx+i*(barW+gap)} y={baseY-maxH*h} width={barW} height={maxH*h} rx={barW*0.32} fill={bc[i]}/>)}
      <path d={roofPath} fill={roofColor}/>
    </svg>
  );
}

function OGImage() {
  // Subtle dot-grid texture via SVG pattern
  const dotPattern = `url("data:image/svg+xml,%3Csvg width='32' height='32' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='1' cy='1' r='1' fill='rgba(255,255,255,0.04)'/%3E%3C/svg%3E")`;

  return (
    <div style={{
      width:1200, height:630,
      background: B.charcoal,
      position:'relative', overflow:'hidden',
      fontFamily:"'Sora',sans-serif",
    }}>
      {/* Dot grid */}
      <div style={{ position:'absolute', inset:0, backgroundImage: dotPattern, backgroundSize:'32px 32px' }}/>

      {/* Gold glow accent top-right */}
      <div style={{
        position:'absolute', top:-160, right:-120,
        width:520, height:520, borderRadius:'50%',
        background:`radial-gradient(circle, rgba(242,201,76,0.12) 0%, transparent 70%)`,
        pointerEvents:'none',
      }}/>

      {/* Bottom-left glow */}
      <div style={{
        position:'absolute', bottom:-120, left:-80,
        width:400, height:400, borderRadius:'50%',
        background:`radial-gradient(circle, rgba(242,201,76,0.07) 0%, transparent 70%)`,
        pointerEvents:'none',
      }}/>

      {/* Logo mark — large, top left */}
      <div style={{ position:'absolute', top:64, left:72 }}>
        <div style={{ display:'flex', alignItems:'center', gap:20 }}>
          <RoofMark size={80} roofColor={B.white}
            barColors={['rgba(255,255,255,0.28)','rgba(255,255,255,0.52)',B.gold]}
            chimney chimneyWidthScale={1} chimneyHeightScale={0.55}/>
          <div>
            <div style={{ display:'flex', alignItems:'baseline' }}>
              <span style={{ fontWeight:600, fontSize:46, letterSpacing:'-0.025em', color:B.white }}>Equity</span>
              <span style={{ fontWeight:600, fontSize:46, letterSpacing:'-0.025em', color:B.gold }}>Sight</span>
            </div>
          </div>
        </div>
      </div>

      {/* Main headline */}
      <div style={{
        position:'absolute', bottom:120, left:72, right:72,
      }}>
        <div style={{
          fontFamily:"'Sora',sans-serif",
          fontWeight:700, fontSize:72, lineHeight:1.08,
          letterSpacing:'-0.03em',
          color:B.white,
          marginBottom:24,
        }}>
          Property finance,<br/>
          <span style={{ color:B.gold, fontStyle:'normal' }}>finally clear.</span>
        </div>
        <div style={{
          fontFamily:"'Geist',sans-serif",
          fontWeight:400, fontSize:22,
          color:'rgba(255,255,255,0.5)',
          letterSpacing:'0.02em',
        }}>
          equitysight.app
        </div>
      </div>

      {/* Right side — bar chart illustration */}
      <div style={{ position:'absolute', right:72, bottom:90 }}>
        <RoofMark size={240} roofColor="rgba(255,255,255,0.07)"
          barColors={['rgba(242,201,76,0.15)','rgba(242,201,76,0.28)','rgba(242,201,76,0.55)',B.gold]}
          chimney chimneyWidthScale={1} chimneyHeightScale={0.55}/>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<OGImage/>);
</script>
<div id="root"></div>
</body>
</html>
