[build]
  command = "node build.js"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ── Global Security Headers ────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    Content-Security-Policy = """
default-src 'self';
script-src 'self'
  https://js.stripe.com
  https://pagead2.googlesyndication.com
  https://adservice.google.com
  https://www.googletagservices.com
  https://www.googletagmanager.com
  https://accounts.google.com
  'sha256-1yHDvs7+Z29Z4G1LhYbHujCAQgQe6Dl/3X8zy2dAQfs='
  'sha256-pXTTJfAUfWH4QBYak7cRfbfeMucEscH05RFbEVdE6Gw=';
style-src 'self' 'unsafe-inline'
  https://fonts.googleapis.com
  https://accounts.google.com;
font-src 'self' https://fonts.gstatic.com;
img-src 'self' data: blob: https:;
connect-src 'self'
  https://api.stripe.com
  https://nominatim.openstreetmap.org
  https://ipwho.is
  https://ipapi.co
  https://api.rba.gov.au
  https://data.api.abs.gov.au
  https://api.domain.com.au
  https://auth.domain.com.au
  https://pagead2.googlesyndication.com
  https://googleads.g.doubleclick.net
  https://adservice.google.com
  https://www.google-analytics.com
  https://region1.google-analytics.com
  https://www.googletagmanager.com
  https://ingesteer.services-prod.nsvcs.net
  https://ep1.adtrafficquality.google
  https://accounts.google.com
  https://oauth2.googleapis.com;
frame-src
  https://js.stripe.com
  https://hooks.stripe.com
  https://googleads.g.doubleclick.net
  https://tpc.googlesyndication.com
  https://accounts.google.com;
object-src 'none';
base-uri 'self';
form-action 'self';
frame-ancestors 'none';
"""

# ── Functions CORS ─────────────────────────────────────────────────────────
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization, Stripe-Signature"
    Access-Control-Allow-Methods = "GET, POST, DELETE, OPTIONS"
    X-Content-Type-Options = "nosniff"

# ── Caching ────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/tools/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Basic Redirect ─────────────────────────────────────────────────────────
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 200

# ── Block sensitive/dev files ──────────────────────────────────────────────
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

