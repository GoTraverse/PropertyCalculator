  status = 404
  force = true

[[redirects]]
  from = "/TODO.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/LINK_AUDIT_REPORT.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/ERRORS.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/build.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/build-suburbs.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/generate-suburbs-data.js"
  to = "/404.html"
  status = 404
