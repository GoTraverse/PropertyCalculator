# ── Fix relative-path asset requests from cached suburb/invest pages ─────────
# Older cached builds used relative paths (e.g. shared.css instead of /shared.css).
# These rewrites serve the correct root-level files transparently until a
# suburb rebuild regenerates all pages with correct absolute paths.

[[redirects]]
  from = "/invest/*/shared.css"
  to = "/shared.css"
  status = 200
  force = true

[[redirects]]
  from = "/invest/*/tools.css"
  to = "/tools.css"
  status = 200
