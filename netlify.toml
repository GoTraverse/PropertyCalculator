# ── Block exploit probes ───────────────────────────────────────────────────
[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/xmlrpc.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wordpress/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-includes/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/index.php"
  to = "/404.html"
  status = 404
  force = true

# ── Tool clean URLs ────────────────────────────────────────────────────────
[[redirects]]
  from = "/tools/*"
  to = "/tools/:splat.html"
  status = 301

# ── Allow ads.txt ──────────────────────────────────────────────────────────
[[redirects]]
  from = "/ads.txt"
  to = "/ads.txt"
  status = 200

# ── Catch-all 404 ──────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  force = false
