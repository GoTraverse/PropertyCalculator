# ── Block common bot/exploit probes ──────────────────────────────────────────
# These are automated attacks scanning for WordPress/PHP installations.
# Catch-all already returns 404, but explicit rules skip disk lookup entirely.

[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/xmlrpc.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wordpress/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-includes/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/index.php"
  to = "/404.html"
  status = 404
  force = true

