name: Production canary

# Hourly synthetic check against https://equitysight.app. If the smoke suite
# fails, GitHub raises the workflow as a failed run — wire that into Slack /
# email via GitHub repository notification settings. Cheaper and more reliable
# than a third-party uptime service for a Netlify-hosted static site.

on:
  schedule:
    - cron: '17 * * * *'   # every hour at :17 (off-peak-minute to spread load)
  workflow_dispatch:        # allow manual trigger from the Actions tab

jobs:
  canary:
    name: Smoke against production
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install test deps
        working-directory: tests
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run smoke against production
        working-directory: tests
        env:
          BASE_URL: https://equitysight.app
          CI: true
        run: npx playwright test --project=chromium

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canary-report-${{ github.run_id }}
          path: tests/playwright-report/
          retention-days: 14
