name: Production canary

# Hourly synthetic check against https://equitysight.app. If the smoke suite
# fails, GitHub raises the workflow as a failed run — wire that into Slack /
# email via GitHub repository notification settings.
#
# ⚠️ SCHEDULE DISABLED until PR #197 lands on production.
# The smoke suite asserts on features that ship in that PR (6-link nav, /tools
# landing, aria-live on result containers, no inline onclick). Running against
# pre-merge production produces noisy hourly failure emails.
#
# Once PR #197 is deployed to prod:
#   1. Uncomment the `schedule:` block below
#   2. Push to `Staging` or `main`
# The `workflow_dispatch` trigger stays on so you can still run the canary
# manually from the Actions tab at any time.

on:
  # schedule:
  #   - cron: '17 * * * *'   # every hour at :17
  workflow_dispatch:        # manual run from the Actions tab

jobs:
  canary:
    name: Smoke against production
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test deps
        working-directory: tests
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run smoke against production
        working-directory: tests
        env:
          BASE_URL: https://equitysight.app
          CI: true
        run: npx playwright test --project=chromium

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canary-report-${{ github.run_id }}
          path: tests/playwright-report/
          retention-days: 14
