name: Playwright smoke (PR)

# Runs the tests/smoke.spec.mjs suite against the Netlify deploy preview URL
# for this PR. Blocks merge if smoke fails.
#
# Deploy-preview URL follows Netlify's convention:
#   https://deploy-preview-<pr-number>--<site-name>.netlify.app
# Override via the NETLIFY_SITE_NAME repo variable.

on:
  pull_request:
    branches: [Staging, main]
    types: [opened, synchronize, reopened]

jobs:
  smoke:
    name: Smoke tests against deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test deps
        working-directory: tests
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Wait for Netlify deploy preview to be ready
        id: wait
        env:
          SITE_NAME: ${{ vars.NETLIFY_SITE_NAME || 'equitysight' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          URL="https://deploy-preview-${PR_NUMBER}--${SITE_NAME}.netlify.app"
          echo "Preview URL: $URL"
          # Poll for up to 5 min waiting for the preview to go live
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null -w "%{http_code}" "$URL" | grep -q "^2\|^3"; then
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "Preview is live."
              exit 0
            fi
            echo "Preview not ready yet (attempt $i/30), sleeping 10s..."
            sleep 10
          done
          echo "::error::Preview never became reachable."
          exit 1

      - name: Run smoke tests
        working-directory: tests
        env:
          BASE_URL: ${{ steps.wait.outputs.url }}
          CI: true
        run: npx playwright test --project=chromium --project=mobile

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.event.pull_request.number }}
          path: tests/playwright-report/
          retention-days: 7
