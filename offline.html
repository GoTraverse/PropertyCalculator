<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<script>try{if(localStorage.getItem("equitySight_theme")==="dark")document.documentElement.classList.add("dark-mode")}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>You're offline (EquitySight.app)</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  /* Inline and self-contained so this page renders when no CSS is cached. */
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #fff; color: #1C1C1E;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px; line-height: 1.55;
  }
  main { max-width: 720px; margin: 0 auto; padding: 56px 24px 72px; }
  h1 { font-size: 32px; line-height: 1.15; margin: 0 0 10px; }
  p { margin: 0 0 14px; }
  ul { padding-left: 22px; margin: 0; }
  li { margin-bottom: 6px; }
  a { color: #0B4F9E; text-decoration: underline; text-underline-offset: 2px; }
  @media (max-width: 600px) { main { padding: 36px 18px 56px; } }
  /* Follows the theme chosen on the site (html.dark-mode, set by the inline script above). */
  html.dark-mode body { background: #111113; color: #F5F0E8; }
  html.dark-mode a { color: #8AB4F8; }
</style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>EquitySight can't reach the network right now. The First Home Journey is saved on this device and still opens. A calculator opens offline if you've used it on this device before.</p>
    <ul>
      <li><a href="/journey">First Home Journey</a></li>
      <li><a href="/tools/">Calculators</a></li>
      <li><a href="/">Home page</a></li>
    </ul>
  </main>
</body>
</html>
