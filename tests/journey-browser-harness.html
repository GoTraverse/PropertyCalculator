<body class="journey-page">
<main id="main-content" class="jwrap">

  <div class="jview" id="jv-wizard"><div id="jwizard"></div></div>
  <div class="jview" id="jv-projector"><div id="jctx-chips"></div><p id="jduty-note"></p><section class="jpaths" id="jpaths"></section><section class="jcard jpad"><div class="jbars" id="jbars"></div></section><section class="jcard jpad"><span class="jsc">Your stake, years after you buy</span><div class="jnet" id="jnet"></div></section><section class="jcard jpad"><span class="jsc jblock">Boost any path: the super saver</span><div class="jfhss" id="jfhss"></div></section><section><div class="jread" id="jread"></div></section><section id="jscen"></section><section class="jcard jpad jdone-row"><div><span class="jsc jsc-sage">Milestone</span><div class="jdone-t">You know your path.</div></div><button class="jbtn" data-jmark="2">Mark this stop done</button></section></div>
  <div class="jview" id="jv-budget"><div id="jbudget"></div></div>
  <div class="jview" id="jv-ground"><div id="jground"></div></div>
  <div class="jview" id="jv-hunt">
    <div class="jstephead"><span class="jsc">Stop 5 · Hunt &amp; compare</span><h2>Every inspection, on the record</h2></div>
    <div id="jhunt"></div>
  </div>
  <div class="jview" id="jv-settle"><div id="jsettle-checks"></div></div>

<script>
window.addEventListener('load', function () {
  var q = new URLSearchParams(location.search);
  if (q.get('view')) {
    setTimeout(function () {
      var b = document.querySelector('[data-jgoto="' + q.get('view') + '"]');
      if (b) b.click();
      setTimeout(function () {
        var pill = document.querySelector('[data-place-status]');
        if (pill && q.get('picker') === '1') pill.click();
      }, 250);
    }, 250);
  }
});
</script>
