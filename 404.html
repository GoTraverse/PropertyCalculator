<!DOCTYPE html>
<html lang="en-AU">
<head>
<script src="/gtag-loader.js" defer></script>
<script src="/analytics.js" defer></script>
<meta charset="UTF-8">
<script>try{if(localStorage.getItem("equitySight_theme")==="dark")document.documentElement.classList.add("dark-mode")}catch(e){}</script>
<script src="/site-init.js" defer></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Page not found on EquitySight.app</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon.svg">
<meta name="theme-color" content="#1C1C1E">
<link rel="stylesheet" href="shared.css">
<style>
  .notfound-wrap {
    min-height: 70vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 24px;
  }
  .notfound-code {
    font-family: var(--font-display);
    font-size: clamp(80px, 20vw, 160px);
    font-weight: 900;
    color: var(--gold);
    line-height: 1;
    margin: 0;
  }
  .notfound-title {
    font-family: var(--font-display);
    font-size: clamp(20px, 5vw, 32px);
    color: var(--charcoal);
    margin: 16px 0 12px;
  }
  html.dark-mode .notfound-title { color: var(--cream); }
  .notfound-sub {
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--slate);
    max-width: 400px;
    line-height: 1.6;
    margin: 0 0 32px;
  }
  html.dark-mode .notfound-sub { color: rgba(245,240,232,0.6); }
  .notfound-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn-primary {
    display: inline-block;
    padding: 12px 28px;
    background: var(--gold);
    color: var(--charcoal);
    text-decoration: none;
    border-radius: var(--radius-md);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15px;
  }
  .btn-secondary {
    display: inline-block;
    padding: 12px 28px;
    background: transparent;
    color: var(--charcoal);
    text-decoration: none;
    border-radius: var(--radius-md);
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 15px;
    border: 1.5px solid rgba(28,28,30,0.25);
  }
  html.dark-mode .btn-secondary { color: var(--cream); border-color: rgba(245,240,232,0.25); }
</style>
</head>
<body>
<div id="auth-nav-root"></div>
<div class="notfound-wrap">
  <p class="notfound-code">404</p>
  <h1 class="notfound-title">Page not found</h1>
  <p class="notfound-sub">This page doesn't exist, or it has moved.</p>
  <div class="notfound-actions">
    <a href="/journey" class="btn-primary">Go to the First Home Journey</a>
    <a href="/" class="btn-secondary">Home page</a>
  </div>
  <div style="margin-top:32px;">
    <a href="/tools/" style="font-size:14px;color:var(--slate);text-decoration:underline;margin-right:16px;">All calculators</a>
    <a href="/suburb/" style="font-size:14px;color:var(--slate);text-decoration:underline;">Suburb profiles</a>
  </div>
</div>
<script src="/auth-nav-loader.js" defer></script>
</body>
</html>
