<!DOCTYPE html>
<html>
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-TYQXT24670"></script>
<script src="/gtag-init.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EquitySight Import Test</title>
</head>

<body>

<h2>Property Import Test</h2>

<input id="url" style="width:100%" placeholder="Paste property URL">

<br><br>

<button onclick="openListing()">Open Listing</button>

<button onclick="showURL()">Test Import</button>

<pre id="result"></pre>

<script>

function openListing(){
  const url = document.getElementById("url").value
  window.location.href = url
}

function showURL(){
  const url = document.getElementById("url").value
  document.getElementById("result").innerText =
    "Importer received:\n\n" + url
}

</script>

</body>
</html>
